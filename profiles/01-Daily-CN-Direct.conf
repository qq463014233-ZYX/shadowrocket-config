# Shadowrocket daily profile - 2026-10-24
# Requires Shadowrocket 2.2.92 or later. Use Global Routing: Config.
# PROXY uses the usable server selected on Home. No subscription or credentials are included.
# Mainland services / selected China CDNs: DIRECT; other destinations: PROXY.
# Rule data: SukkaLab/ruleset.skk.moe (AGPL-3.0), pinned snapshot.
# No HTTPS decryption, certificate installation, or remote scripts.

[General]
# Locally required DNS for non-DIRECT domains goes through the selected proxy.
# For proxied domain connections Shadowrocket may instead send the domain to the proxy server.
dns-server = https://cloudflare-dns.com/dns-query#proxy,https://dns.google/dns-query#proxy

# Normally DIRECT domain rules use mainland DoH; failure can use the proxy DoH fallback below.
# IP URLs avoid resolver-hostname bootstrap.
direct-dns-server = https://223.5.5.5/dns-query,https://223.6.6.6/dns-query

# Explicit encrypted fallback; an empty value or 'system' would permit system DNS fallback.
fallback-dns-server = https://cloudflare-dns.com/dns-query#proxy,https://dns.google/dns-query#proxy

# The proxy server hostname must be resolved before the proxy is connected.
# This intentional DIRECT encrypted bootstrap exposes that hostname to AliDNS.
proxy-dns-server = https://223.5.5.5/dns-query,https://223.6.6.6/dns-query
dns-direct-system = false
dns-direct-fallback-proxy = false

# Intercept these known hard-coded plaintext DNS endpoints only. This is not all DNS.
# App-owned DoH / HTTPDNS on HTTPS is governed by routing rules, not this list.
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,223.5.5.5:53,223.6.6.6:53,119.29.29.29:53,114.114.114.114:53

# Reduce IPv6 variables. This does not disable IPv6 on the entire iPhone or to the proxy server.
# IPv6-only / NAT64 networks may require ipv6=true after device testing.
ipv6 = false
prefer-ipv6 = false

# Never silently send proxied UDP DIRECT if the selected node cannot relay UDP.
# Traffic already matching DIRECT, including domestic games, remains DIRECT.
udp-policy-not-supported-behaviour = REJECT

[Rule]
# Local network access, handled by rules rather than a broad TUN exclusion.
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,::1/128,DIRECT,no-resolve
IP-CIDR,fc00::/7,DIRECT,no-resolve
IP-CIDR,fe80::/10,DIRECT,no-resolve

# Exact / suffix domain sets and typed rule sets use different directives.
DOMAIN-SET,https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/6c5bee5b8768fe092b85572e8f2c0ec0a900d44a/List/domainset/apple_cdn.conf,DIRECT
RULE-SET,https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/6c5bee5b8768fe092b85572e8f2c0ec0a900d44a/List/non_ip/microsoft_cdn.conf,DIRECT
RULE-SET,https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/6c5bee5b8768fe092b85572e8f2c0ec0a900d44a/List/non_ip/domestic.conf,DIRECT
DOMAIN-SUFFIX,cn,DIRECT

# Match literal / already-known mainland IPs without forcing an extra lookup of unknown domains.
# A missing mainland domain can therefore fall through to PROXY. See the guide for adding an exception.
GEOIP,CN,DIRECT,no-resolve
FINAL,PROXY

